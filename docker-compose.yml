version: "3.8"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hazeguard-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  postgres:
    image: postgres:16
    container_name: hazeguard-postgres
    environment:
      POSTGRES_USER: hazeguard
      POSTGRES_PASSWORD: hazeguard_dev_pw
      POSTGRES_DB: hazeguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: