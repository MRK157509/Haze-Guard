services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hazeguard-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data

  postgres:
    image: postgres:16
    container_name: hazeguard-postgres
    environment:
      POSTGRES_DB: hazeguard
      POSTGRES_USER: hazeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  mosquitto_data:
  pgdata: